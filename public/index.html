<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Projects</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#161616;--muted:#555;--line:#d9d5ce;--bg:#f4f2ee;--card:#fff;--accent:#7a2e2a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;font-size:16px;line-height:1.55}
a{color:var(--accent)}
header{position:sticky;top:0;z-index:10;background:var(--ink);color:#fff}
.bar{max-width:1100px;margin:0 auto;padding:12px 18px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px}
.brand{font-family:Archivo,sans-serif;font-weight:800;font-size:20px;letter-spacing:.02em;margin-right:auto;color:#fff;text-decoration:none}
nav{display:flex;flex-wrap:wrap;gap:4px}
nav a{color:#ddd;text-decoration:none;padding:10px 12px;border-radius:8px;font-weight:500;font-size:15px;min-height:44px;display:inline-flex;align-items:center}
nav a[aria-current="page"]{background:#fff;color:var(--ink)}
main{max-width:1100px;margin:0 auto;padding:32px 18px 80px}
section.view{display:none}
section.view.active{display:block}
.eyebrow{margin:0 0 6px;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:600}
h1{font-family:Archivo,sans-serif;font-weight:800;font-size:clamp(30px,5vw,46px);line-height:1.05;margin:0 0 12px}
h2{font-family:Archivo,sans-serif;font-size:24px;margin:0 0 10px}
h3{font-family:Archivo,sans-serif;font-size:19px;margin:0 0 8px}
.lede{color:var(--muted);max-width:680px;margin:0 0 28px}
.card{background:var(--card);border-radius:14px;padding:22px;margin-bottom:20px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px}
.cols3{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px}
ul.tight,ol.tight{margin:0;padding-left:20px}
ul.tight li,ol.tight li{margin:4px 0}
.tile{display:block;background:var(--card);border-radius:14px;padding:22px;text-decoration:none;color:var(--ink);border:1px solid transparent}
.tile:hover{border-color:var(--ink)}
.tile p{margin:0;color:var(--muted)}
.swatches{display:flex;gap:8px;margin-bottom:14px}
.swatches span{flex:1;height:64px;border-radius:8px;border:1px solid rgba(0,0,0,.08)}
.keep{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:20px}
.keep div{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:12px;padding:12px}
.keep i{width:44px;height:44px;border-radius:8px;border:1px solid rgba(0,0,0,.1);flex:none}
.note{font-size:14px;color:var(--muted)}
svg{max-width:100%;height:auto;display:block}
.wf{border:2px solid var(--ink);border-radius:12px;overflow:hidden;background:#fff;font-size:14px}
.wf .blk{border-bottom:1px dashed var(--line);padding:14px 16px}
.wf .blk:last-child{border-bottom:none}
.wf .lbl{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:8px}
.wf .hero{background:var(--ink);color:#fff;padding:28px 16px}
.wf .hero .lbl{color:#bbb}
.wf .hero b{font-family:Archivo,sans-serif;font-size:22px;display:block;margin-bottom:10px}
.pill{display:inline-block;background:var(--accent);color:#fff;border-radius:999px;padding:6px 14px;font-weight:600;font-size:13px}
.pill.alt{background:#fff;color:var(--ink);border:1px solid var(--ink)}
.bgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.bcard{border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center}
.bcard .ph{height:64px;border-radius:8px;background:#e9e6e0;margin-bottom:8px}
.gal{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.gal span{aspect-ratio:1;background:#e9e6e0;border-radius:6px}
ul.check{padding-left:0}
.check li{list-style:none;position:relative;padding-left:26px}
.check li::before{content:"";position:absolute;left:0;top:6px;width:14px;height:14px;border:2px solid var(--accent);border-radius:3px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.full{grid-column:1/-1}
label{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600}
input,textarea{font:inherit;font-weight:400;padding:11px 12px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);width:100%}
input:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
textarea{min-height:84px;resize:vertical}
fieldset{border:none;padding:0;margin:0}
legend{font-size:14px;font-weight:600;margin-bottom:6px;padding:0}
.opts{display:flex;flex-wrap:wrap;gap:4px 18px}
.opts label{flex-direction:row;align-items:center;gap:8px;font-weight:400;min-height:40px}
.opts input{width:18px;height:18px;padding:0}
.item{border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.item-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.item-head strong{font-family:Archivo,sans-serif;font-size:17px}
.insp .opts label{min-height:36px}
.helpbtn{background:var(--accent);border-color:var(--accent);color:#fff;padding:10px 14px}
dialog#help{border:none;border-radius:16px;padding:0;max-width:760px;width:calc(100% - 24px);max-height:calc(100vh - 32px);color:var(--ink)}
dialog#help::backdrop{background:rgba(0,0,0,.55)}
.help-head{position:sticky;top:0;background:#fff;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 22px;border-bottom:1px solid var(--line)}
.help-head h2{margin:0}
.help-body{padding:8px 22px 26px}
.help-body h3{margin:22px 0 6px}
.help-body p{margin:6px 0}
.help-body code{background:#f1efea;border-radius:6px;padding:2px 6px;font-size:14px;word-break:break-all}
.help-body .urls{list-style:none;padding:0;margin:8px 0}
.help-body .urls li{padding:8px 0;border-bottom:1px solid var(--line)}
.help-body .urls a{font-weight:600}
.svc{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:10px;align-items:end;margin-bottom:10px}
button{font:inherit;font-weight:600;border-radius:10px;padding:12px 18px;min-height:44px;cursor:pointer;border:1px solid var(--ink)}
.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.ghost{background:#fff;color:var(--ink)}
.link{background:none;border:none;color:var(--accent);padding:6px 4px;text-decoration:underline}
.actions{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.savebar{position:sticky;bottom:0;background:var(--bg);padding:14px 0;border-top:1px solid var(--line);z-index:5}
.status{font-size:14px;color:var(--muted)}
.status.err{color:#a3261f}
.gate{max-width:420px}
pre{white-space:pre-wrap;background:#faf9f6;border:1px solid var(--line);border-radius:10px;padding:14px;font-size:14px;max-height:420px;overflow:auto}
@media (max-width:600px){.grid{grid-template-columns:1fr}.svc{grid-template-columns:1fr 1fr}.svc label:first-child{grid-column:1/-1}}
</style>
</head>
<body>
<header><div class="bar"><span class="brand">Projects</span></div></header>
<main>
  <p class="eyebrow">Choose a project</p>
  <h1>Where do you want to go?</h1>
  <div class="cols" style="margin-top:24px">
    <a class="tile" href="/shop/"><h3>Barbershop →</h3><p>The new website for the shop and the move to Encino: website plan and shop info form.</p></a>
    <a class="tile" href="/airstream/"><h3>Airstream →</h3><p>Turning the Airstream into an Airbnb: layout options, guest setup, listing checklist and info form.</p></a>
  </div>
</main>
</body>
</html>
